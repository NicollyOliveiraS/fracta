<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>FRACTA Cadastro</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    body {
      font-family: "Fredoka", sans-serif;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center bg-[url('../img/fundo.png')] bg-cover bg-center p-3 sm:p-6 md:p-8">

  <div class="w-full max-w-6xl flex flex-col md:flex-row items-center justify-center gap-6 md:gap-12 my-auto">

    <div class="w-full md:w-1/2 flex justify-center pt-6 md:pt-0">
      <div class="text-center md:text-left px-4">
        <h1 class="text-3xl sm:text-4xl md:text-5xl text-black font-bold mb-2 md:mb-4">
          Aprender é
        </h1>

        <h2 class="text-2xl sm:text-3xl text-orange-500 font-medium mb-2">
          descobrir o mundo
        </h2>

        <p class="text-black text-base sm:text-lg md:text-xl max-w-md mx-auto md:mx-0">
          Explore, imagine e descubra o poder das frações!
        </p>
      </div>
    </div>

    <div class="w-full md:w-1/2 flex items-center justify-center p-2 sm:p-4">
      <div class="shadow-2xl backdrop-blur-sm rounded-2xl p-6 sm:p-8 md:p-10 w-full max-w-md bg-white/40">

        <h1 class="flex justify-center text-black text-3xl sm:text-4xl md:text-5xl font-bold mb-6">
          Cadastro
        </h1>

        <form id="cadastroForm" class="space-y-5">

          <div>
            <label
              for="cadNome"
              class="block text-black text-sm mb-1 font-medium"
            >
              Nome completo
            </label>

            <input
              id="cadNome"
              name="nome"
              type="text"
              autocomplete="name"
              required
              class="w-full bg-transparent border-b-2 border-black/60 outline-none text-black pb-2 focus:border-black transition"
            >
          </div>

          <div>
            <label
              for="cadEmail"
              class="block text-black text-sm mb-1 font-medium"
            >
              E-mail
            </label>

            <input
              id="cadEmail"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="seuemail@exemplo.com"
              required
              class="w-full bg-transparent border-b-2 border-black/60 outline-none text-black pb-2 focus:border-black transition"
            >
          </div>

          <div>
            <label
              for="tipoUsuario"
              class="block text-black text-sm mb-1 font-medium"
            >
              Tipo de usuário
            </label>

            <select
              id="tipoUsuario"
              name="tipo_usuario"
              required
              class="w-full bg-transparent border-b-2 border-black/60 outline-none text-black pb-2 focus:border-black transition"
            >
              <option value="aluno" selected>Aluno</option>
              <option value="professor">Professor</option>
            </select>
          </div>

          <div id="campoTurmaContainer" class="transition-all duration-300">
            <label
              for="cadTurma"
              class="block text-black text-sm mb-1 font-medium flex items-center justify-between"
            >
              <span>Turma</span>
              <span class="text-xs text-orange-600 font-bold">*obrigatório para aluno</span>
            </label>

            <select
              id="cadTurma"
              name="turma"
              required
              class="w-full bg-transparent border-b-2 border-black/60 outline-none text-black pb-2 focus:border-black transition"
            >
              <option value="" disabled selected>Selecione a turma</option>
              <option value="6º A">6º A</option>
              <option value="6º B">6º B</option>
              <option value="7º A">7º A</option>
              <option value="7º B">7º B</option>
            </select>
          </div>

          <div>
            <label
              for="cadSenha"
              class="block text-black text-sm mb-1 font-medium"
            >
              Senha
            </label>

            <input
              id="cadSenha"
              name="senha"
              type="password"
              minlength="6"
              autocomplete="new-password"
              required
              class="w-full bg-transparent border-b-2 border-black/60 outline-none text-black pb-2 focus:border-black transition"
            >
          </div>

          <div>
            <label
              for="confirmarSenha"
              class="block text-black text-sm mb-1 font-medium"
            >
              Confirmar senha
            </label>

            <input
              id="confirmarSenha"
              name="confirmarSenha"
              type="password"
              minlength="6"
              autocomplete="new-password"
              required
              class="w-full bg-transparent border-b-2 border-black/60 outline-none text-black pb-2 focus:border-black transition"
            >
          </div>

          <button
            id="btnCadastrar"
            type="submit"
            class="w-full bg-black text-white py-3 rounded-xl text-lg font-semibold hover:bg-neutral-900 hover:scale-[1.02] active:scale-[0.98] disabled:opacity-60 disabled:cursor-not-allowed transition-all shadow-lg mt-6"
          >
            Cadastrar
          </button>

          <p
            id="mensagemCadastro"
            class="hidden text-sm text-center font-semibold"
            role="alert"
          ></p>

          <p class="text-black text-sm text-center pt-2">
            Já tem uma conta?

            <a
              href="login.html"
              class="text-orange-500 font-semibold hover:underline"
            >
              Faça login
            </a>
          </p>

        </form>
      </div>
    </div>

  </div>

  <script src="../scripts/fracta-db.js"></script>
  <script src="../scripts/script.js"></script>
</body>
</html>
