<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FRACTA - Recuperar Senha</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Fredoka', sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-[url('../img/fundo.png')] bg-cover bg-center p-3 sm:p-6 md:p-8">

  <div class="w-full max-w-6xl flex flex-col md:flex-row items-center justify-center gap-6 md:gap-12 my-auto">

    <!-- Texto esquerdo -->
    <div class="w-full md:w-1/2 flex justify-center pt-6 md:pt-0">
      <div class="text-center md:text-left px-4">
        <h1 class="text-3xl sm:text-4xl md:text-5xl text-black font-bold mb-2 md:mb-4">
          Recuperar sua
        </h1>

        <h2 class="text-2xl sm:text-3xl text-orange-500 font-medium mb-2">
          senha de acesso
        </h2>

        <p class="text-black text-base sm:text-lg md:text-xl max-w-md mx-auto md:mx-0">
          Informe seu e-mail para receber sua nova senha de acesso.
        </p>
      </div>
    </div>

    <!-- Card Recuperação -->
    <div class="w-full md:w-1/2 flex items-center justify-center p-2 sm:p-4">
      <div class="shadow-2xl backdrop-blur-sm rounded-2xl p-6 sm:p-8 md:p-10 w-full max-w-md bg-white/40">

        <img
          src="../img/image__1_-removebg-preview.png"
          class="w-32 sm:w-40 md:w-44 h-auto mb-4 mx-auto object-contain"
          alt="Logo FRACTA"
        >

        <h1 class="flex justify-center text-black text-3xl sm:text-4xl md:text-5xl font-bold mb-6">
          Recuperar
        </h1>

        <form id="recuperarForm" class="space-y-5">

          <div>
            <label for="recuperarEmail" class="block text-black text-sm mb-1 font-medium">
              E-mail cadastrado
            </label>

            <input
              id="recuperarEmail"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="seuemail@exemplo.com"
              required
              class="w-full bg-transparent border-b-2 border-black/60 outline-none text-black pb-2 focus:border-black transition"
            >
          </div>

          <button
            id="btnRecuperar"
            type="submit"
            class="w-full bg-black text-white py-3 rounded-xl text-lg font-semibold hover:bg-neutral-900 hover:scale-[1.02] active:scale-[0.98] transition-all shadow-lg mt-6"
          >
            Redefinir Senha
          </button>

          <p
            id="mensagemRecuperar"
            class="hidden text-sm text-center font-semibold"
            role="alert"
          ></p>

          <!-- Bloco com a nova senha gerada -->
          <div id="resultadoRecuperacao" class="hidden mt-4 p-4 bg-white/90 border border-amber-300 rounded-xl text-center space-y-3 shadow-md">
            <div class="inline-flex items-center justify-center w-10 h-10 bg-green-100 text-green-600 rounded-full mb-1">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <p class="text-xs text-gray-700 font-medium">Sua nova senha de acesso foi gerada:</p>
            <div class="flex items-center justify-center gap-2">
              <span id="senhaGeradaDisplay" class="font-mono text-lg font-bold text-black bg-orange-50 px-3 py-1.5 rounded-lg border border-orange-200 select-all"></span>
              <button
                type="button"
                id="btnCopiarSenha"
                class="px-3 py-1.5 bg-orange-500 hover:bg-orange-600 text-white rounded-lg text-xs font-semibold transition"
                title="Copiar senha"
              >
                Copiar
              </button>
            </div>
            <p class="text-xs text-gray-500">Copie a senha acima para fazer login.</p>
            <a
              href="login.html"
              class="inline-block w-full bg-black text-white py-2.5 rounded-xl text-sm font-semibold hover:bg-neutral-900 transition mt-2"
            >
              Ir para o Login
            </a>
          </div>

          <p class="text-black text-sm text-center pt-2">
            Lembrou sua senha?
            <a
              href="login.html"
              class="text-orange-500 font-semibold hover:underline"
            >
              Voltar para o Login
            </a>
          </p>

        </form>

      </div>
    </div>

  </div>

  <script src="../scripts/script.js"></script>

</body>
</html>
