<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRACTA Login</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Fredoka', sans-serif;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center bg-[url('../img/fundo.png')] bg-cover bg-center p-3 sm:p-6 md:p-8">

  <div class="w-full max-w-6xl flex flex-col md:flex-row items-center justify-center gap-6 md:gap-12 my-auto">

    <!-- Texto esquerdo -->
    <div class="w-full md:w-1/2 flex justify-center pt-6 md:pt-0">
      <div class="text-center md:text-left px-4">
        <h1 class="text-3xl sm:text-4xl md:text-5xl text-black font-bold mb-2 md:mb-4">
          Aprender é
        </h1>

        <h2 class="text-2xl sm:text-3xl text-orange-500 font-medium mb-2">
          descobrir o mundo
        </h2>

        <p class="text-black text-base sm:text-lg md:text-xl max-w-md mx-auto md:mx-0">
          Explore, imagine e descubra o poder das frações!
        </p>
      </div>
    </div>

    <!-- Card Login -->
    <div class="w-full md:w-1/2 flex items-center justify-center p-2 sm:p-4">
      <div class="shadow-2xl backdrop-blur-sm rounded-2xl p-6 sm:p-8 md:p-10 w-full max-w-md bg-white/40">
        <img src="../img/image__1_-removebg-preview.png" class="w-32 sm:w-40 md:w-44 h-auto mb-4 mx-auto object-contain" alt="Logo FRACTA">
        <h1 class="flex justify-center text-black text-3xl sm:text-4xl md:text-5xl font-bold mb-6">
          Bem-vindo!
        </h1>

        <form id="loginForm" class="space-y-5">

          <div>
            <label for="email" class="block text-black text-sm mb-1 font-medium">
              E-mail
            </label>

            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="seuemail@exemplo.com"
              required
              class="w-full bg-transparent border-b-2 border-black/60 outline-none text-black pb-2 focus:border-black transition"
            >
          </div>

          <div>
            <label for="senha" class="block text-black text-sm mb-1 font-medium">
              Senha
            </label>

            <input
              id="senha"
              name="senha"
              type="password"
              autocomplete="current-password"
              required
              class="w-full bg-transparent border-b-2 border-black/60 outline-none text-black pb-2 focus:border-black transition"
            >
          </div>
          <p class="text-black text-sm text-center">
            <a href="esqueci-senha.html" class="text-orange-500 font-semibold hover:underline">
              Esqueceu a senha?
            </a>
          </p>
          <button
            id="btnEntrar"
            type="submit"
            class="w-full bg-black text-white py-3 rounded-xl text-lg font-semibold hover:bg-neutral-900 hover:scale-[1.02] active:scale-[0.98] transition-all shadow-lg mt-6"
          >
            Entrar
          </button>

          <p id="mensagemLogin" class="hidden text-sm text-center font-semibold" role="alert"></p>

          <p class="text-black text-sm text-center pt-2">
            Não possui uma conta?
            <a
              href="cadastro.html"
              class="text-orange-500 font-semibold hover:underline"
            >
              Cadastre-se
            </a>
          </p>

        </form>

      </div>
    </div>

  </div>

  <script src="../scripts/fracta-db.js"></script>
  <script src="../scripts/script.js"></script>

</body>
</html>
